<!DOCTYPE html><script src="js/messages.js"></script>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikagne Messages</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="chat">

    <header class="chat-header">
        <h1>💬 Ikagne Messages</h1>
    </header>

    <div class="contact">
        <img src="assets/logo.png" alt="Profil">
        <span>Utilisateur Ikagne</span>
    </div>

    <div class="messages-box">
        <p class="received">Bonjour 👋</p>
        <p class="sent">Bienvenue sur Ikagne</p>
    </div>

    <div class="send-box">
        <input type="text" placeholder="Écrire un message...">
        <button>Envoyer</button>
    </div>

</div>

</body>
</html>
